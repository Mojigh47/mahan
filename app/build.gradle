// Release signing is read from app/keystore.properties when present (gitignored).
// Expected keys: storeFile, storePassword, keyAlias, keyPassword.
def keystorePropertiesFile = rootProject.file("app/keystore.properties")
def keystoreProperties = new Properties()
def hasKeystore = keystorePropertiesFile.exists()
if (hasKeystore) {
	keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
	namespace = "moji.deliverytracker"
	compileSdk = 34

	signingConfigs {
		release {
			if (hasKeystore) {
				storeFile file(keystoreProperties["storeFile"])
				storePassword keystoreProperties["storePassword"]
				keyAlias keystoreProperties["keyAlias"]
				keyPassword keystoreProperties["keyPassword"]
			}
		}
	}

	aaptOptions {
		cruncherEnabled = false
	}

	defaultConfig {
		applicationId = "moji.deliverytracker"
		minSdk = 24
